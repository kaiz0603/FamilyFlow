name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - run: >
          flutter build apk --flavor prod --dart-define=ENV=prod --release
          --obfuscate --split-debug-info=build/symbols
          --split-per-abi --target-platform android-arm,android-arm64
      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk "FamilyFlow-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk "FamilyFlow-${GITHUB_REF_NAME}-armv7.apk"
      - name: Service account
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Upload symbols to Crashlytics
        run: >
          npx --yes firebase-tools@15.37.0 crashlytics:symbols:upload
          --app=${{ secrets.FIREBASE_APP_ID_PROD_ANDROID }} build/symbols
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          "FamilyFlow-${GITHUB_REF_NAME}.apk" "FamilyFlow-${GITHUB_REF_NAME}-armv7.apk"
      - name: App Distribution
        run: >
          npx --yes firebase-tools@15.37.0 appdistribution:distribute "FamilyFlow-${GITHUB_REF_NAME}.apk"
          --app ${{ secrets.FIREBASE_APP_ID_PROD_ANDROID }} --groups testers
          --release-notes "FamilyFlow ${GITHUB_REF_NAME}"
      - name: Remove secrets
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/sa.json"
