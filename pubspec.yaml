name: familyflow
description: "Parents and teens compare how they see the family's parenting style."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.2.0
  cupertino_ui: ^1.1.7
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/

# `dart run flutter_launcher_icons` regenerates the Android and iOS icons from this image.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # icon.png with its gradient extended 25% on each side, so Android masks keep the bubbles whole.
  adaptive_icon_foreground: assets/icon/icon_adaptive.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#16897C"
