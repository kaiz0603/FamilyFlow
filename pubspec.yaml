name: familyflow
description: "Parents and teens compare how they see the family's parenting style."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.2.0
  cupertino_ui: ^1.1.7
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/
